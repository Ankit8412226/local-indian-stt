# Model Registry Configuration
# All verified HuggingFace repositories and model metadata.
# Do NOT add a model here without verifying its HF repo is accessible.

models:

  - model_id: indic-conformer
    name: "IndicConformer Hindi (HF Transformers Wrapper)"
    provider: "AI4Bharat / Anshul1212 (Community HF Conversion)"
    hf_repo: "Anshul1212/indicconformer-hi-hybrid-rnnt-large-hf"
    official_model: false
    source_model: "ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large"
    version: "main"
    model_type: "conformer-hybrid-ctc-rnnt"
    languages: ["hi", "bn", "gu", "kn", "ml", "mr", "or", "pa", "ta", "te", "ur", "as", "ne", "sa", "sd", "kok", "doi", "mai", "mni", "brx", "sat", "ks"]
    default_language: "hi"
    supported_sample_rate: 16000
    decoding_modes: ["rnnt", "ctc"]
    default_decoding_mode: "rnnt"
    parameter_count: null  # Not publicly disclosed for community wrapper
    license: "apache-2.0"
    gated: false
    auth_required: false
    status: "VERIFIED"
    notes: >
      Community Transformers-compatible conversion of the official AI4Bharat NeMo model.
      The official model (ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large) is gated
      and requires HF_TOKEN + user approval. This wrapper is publicly accessible.
      Trust remote code is required (trust_remote_code=True).

  - model_id: indic-conformer-official
    name: "IndicConformer Hindi Large (Official NeMo)"
    provider: "AI4Bharat"
    hf_repo: "ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large"
    official_model: true
    source_model: null
    version: "main"
    model_type: "conformer-hybrid-ctc-rnnt"
    languages: ["hi"]
    default_language: "hi"
    supported_sample_rate: 16000
    decoding_modes: ["rnnt", "ctc"]
    default_decoding_mode: "rnnt"
    license: "mit"
    gated: true
    auth_required: true
    status: "GATED"
    notes: >
      Official AI4Bharat model. Requires NeMo library, HF_TOKEN, and gated access approval.
      Gated status verified September 2026. See: https://huggingface.co/ai4bharat/indicconformer_stt_hi_hybrid_ctc_rnnt_large

