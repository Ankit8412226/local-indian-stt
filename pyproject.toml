[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "local-indian-stt"
version = "0.1.0"
description = "Local Indian Speech-to-Text (STT) inference and benchmarking system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ankit Kumar"},
]
keywords = ["speech-to-text", "asr", "indian", "hindi", "hinglish", "ai4bharat"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "torch>=2.1.0",
  "torchaudio>=2.1.0",
  "transformers>=4.40.0",
  "sentencepiece>=0.1.99",
  "huggingface_hub>=0.20.0",
  "safetensors>=0.4.0",
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "pymongo>=4.6.0",
  "motor>=3.3.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "click>=8.1.0",
  "rich>=13.0.0",
  "jiwer>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "mongomock>=4.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
